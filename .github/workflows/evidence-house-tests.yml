name: Evidence House Backend Tests
on:
  push:
    paths:
      - 'backend/**'
      - 'BLACK/**'
      - 'CONTINUITY/**'
      - 'overdrive/evidence_learning.py'
      - 'overdrive/runner.py'
      - 'house/remediation/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - '.github/workflows/evidence-house-tests.yml'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: evidence-house-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python tests/smoke.py
      - name: Commissioning verification and redacted security scan
        run: |
          python CONTINUITY/commission.py --output /tmp/amx-commissioning
          python CONTINUITY/security_scan.py --output /tmp/amx-security.json
          bash -n BLACK/install-continuity.sh
          bash BLACK/install-continuity.sh --stage /tmp/amx-service-stage
          systemd-analyze verify /tmp/amx-service-stage/etc/systemd/system/amx-black.service /tmp/amx-service-stage/etc/systemd/system/amx-black-continuity.service /tmp/amx-service-stage/etc/systemd/system/amx-black-continuity.timer
      - name: Preserve commissioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: amx-control-plane-${{ github.sha }}
          path: |
            /tmp/amx-commissioning/
            /tmp/amx-security.json
          retention-days: 30
      - name: Build provider-neutral container
        run: docker build -t amx-evidence-house .
      - name: Exercise container runtime
        run: |
          docker run -d --name amx-evidence-house-test -p 8000:8000 amx-evidence-house
          trap 'docker rm -f amx-evidence-house-test >/dev/null 2>&1 || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/amx-health.json; then break; fi
            sleep 1
          done
          cat /tmp/amx-health.json
          curl -fsS http://127.0.0.1:8000/api/house/bootstrap > /tmp/amx-bootstrap.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/amx-health.json'))
          b=json.load(open('/tmp/amx-bootstrap.json'))
          assert h['status']=='CONNECTED'
          assert b['controls']['no_false_live_state'] is True
          assert b['controls']['model_not_matrix'] is True
          print({'container_health':'PASS','container_bootstrap':'PASS','evidence_count':b['evidence']['count']})
          PY
