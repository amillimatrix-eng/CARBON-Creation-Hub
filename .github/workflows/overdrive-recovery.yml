name: AMX OVERDRIVE Worker

on:
  push:
    branches:
      - main
      - root/matrix-recovery-drain-q-20261019
    paths:
      - 'overdrive/runner.py'
      - 'overdrive/payment_truth.py'
      - 'overdrive/payment_verifier.py'
      - 'overdrive/state.json'
      - 'overdrive/opportunities.json'
      - 'overdrive/claims.json'
      - 'overdrive/payment_rails.json'
      - 'AMX/ROOT/BLUE_STATE/MANDATE_REGISTRY_V1.json'
      - 'AMX/ROOT/INTAKE/INTAKE_INDEX.md'
      - 'CONTINUITY.md'
      - 'ACCESS_CONTINUITY.md'
      - 'scripts/matrix_recovery_control.py'
      - 'tests/test_matrix_recovery_control.py'
      - '.github/workflows/overdrive-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'overdrive/runner.py'
      - 'overdrive/payment_truth.py'
      - 'overdrive/payment_verifier.py'
      - 'overdrive/state.json'
      - 'overdrive/opportunities.json'
      - 'overdrive/claims.json'
      - 'overdrive/payment_rails.json'
      - 'AMX/ROOT/BLUE_STATE/MANDATE_REGISTRY_V1.json'
      - 'AMX/ROOT/INTAKE/INTAKE_INDEX.md'
      - 'CONTINUITY.md'
      - 'ACCESS_CONTINUITY.md'
      - 'scripts/matrix_recovery_control.py'
      - 'tests/test_matrix_recovery_control.py'
      - '.github/workflows/overdrive-recovery.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      run_worker:
        description: "Commercial writer stays paused during recovery work. Select run only for separately authorized manual execution."
        required: true
        type: choice
        options:
          - paused
          - run
        default: paused
      recovery_fallback:
        description: "Plan B repo-only fallback; select only if no successful hourly Plan A receipt exists within 75 minutes."
        required: true
        type: choice
        options:
          - not_requested
          - hourly_dependency_unmet
        default: not_requested

permissions:
  contents: write

concurrency:
  group: amx-overdrive-main
  cancel-in-progress: false

jobs:
  # The commercial worker remains explicitly manual-only. The hourly event
  # below is a read-only control/preflight, not a hidden commercial reactivation.
  worker:
    if: github.event_name == 'workflow_dispatch' && inputs.run_worker == 'run' && inputs.recovery_fallback != 'hourly_dependency_unmet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Minute execution window — iSCOPE and PRI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AMX OVERDRIVE"
          git config user.email "amillimatrix@gmail.com"

          # Explicitly authorized manual execution only. This bounded window
          # does not run for scheduled preflight, pushes, or pull requests.
          for tick in $(seq 1 4); do
            echo "AMX minute tick $tick/4"
            git pull --rebase origin main
            python3 overdrive/runner.py

            git add overdrive/state.json overdrive/opportunities.json overdrive/signals.json overdrive/claims.json overdrive/receipts
            if ! git diff --cached --quiet; then
              git commit -m "OVERDRIVE receipt: minute tick $tick persist transitions"
              if ! git push origin HEAD:main; then
                echo "Concurrent main update detected; rebasing persisted tick and retrying once."
                git pull --rebase origin main
                git push origin HEAD:main
              fi
            fi

            if [ "$tick" -lt 4 ]; then
              sleep 60
            fi
          done
      - name: Verify durable state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.load(open("overdrive/state.json"))
          assert state["adapter_status"]=="OPERATIONAL"
          receipts=list(Path("overdrive/receipts").glob("*.json"))
          assert receipts, "no durable receipts"
          claims=json.load(open("overdrive/claims.json"))
          assert "claims" in claims
          opportunities=json.load(open("overdrive/opportunities.json"))
          gated={"NO_CONTACT","REJECTED"}
          readiness_gates={"WAITING","BLOCKED","HUMAN_PROVIDER_GATE","HUMAN_ONLY_GATE","OWNER_GATE","PROVIDER_GATE"}
          for claim in claims["claims"].values():
              if claim.get("status") != "READY":
                  continue
              record=opportunities.get("records",{}).get(claim.get("opportunity_key"),{})
              state=str(record.get("state","")).upper()
              readiness=str(record.get("execution_readiness") or record.get("readiness") or "").upper()
              assert state not in gated, f"suppressed state routed READY: {state} {claim.get('opportunity_key')}"
              assert not readiness.startswith(("HOLD","SUPPRESSED")), f"held/suppressed readiness routed READY: {readiness} {claim.get('opportunity_key')}"
              assert readiness not in readiness_gates, f"gated readiness routed READY: {readiness} {claim.get('opportunity_key')}"
          print("OVERDRIVE minute execution window PASS", len(receipts), "claims", claims.get("ready_count",0))
          PY

  recovery_control:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read last scheduled Plan A completion for a requested fallback
        id: plan_a
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_fallback == 'hourly_dependency_unmet'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_WORKER: ${{ inputs.run_worker }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_WORKER" != "paused" ]]; then
            echo "last_success_at=" >> "$GITHUB_OUTPUT"
            echo "The Plan B control cannot resume the commercial worker." >&2
            exit 0
          fi
          endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/overdrive-recovery.yml/runs?event=schedule&status=completed&per_page=100"
          if ! response="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$endpoint")"; then
            # Sentinel intentionally fails closed in the controller; an API
            # lookup failure must not be mistaken for "Plan A never ran".
            echo "last_success_at=PLAN_A_LOOKUP_FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_success="$(python3 -c 'import json,sys; from scripts.matrix_recovery_control import latest_successful_schedule_timestamp; print(latest_successful_schedule_timestamp(json.load(sys.stdin)) or "")' <<< "$response")"
          echo "last_success_at=$last_success" >> "$GITHUB_OUTPUT"

      - name: Run repository-only recovery control
        env:
          FALLBACK_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_fallback == 'hourly_dependency_unmet' }}
          WORKER_REQUEST: ${{ inputs.run_worker || 'paused' }}
          PLAN_A_LAST_SUCCESS_AT: ${{ steps.plan_a.outputs.last_success_at }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --event "$GITHUB_EVENT_NAME"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --run-number "$GITHUB_RUN_NUMBER"
            --ref "$GITHUB_REF"
            --commit-sha "$GITHUB_SHA"
            --actor "$GITHUB_ACTOR"
            --run-worker "$WORKER_REQUEST"
          )
          if [[ "$FALLBACK_REQUESTED" == "true" ]]; then
            args+=(--fallback-requested)
          fi
          if [[ -n "$PLAN_A_LAST_SUCCESS_AT" ]]; then
            args+=(--last-plan-a-success-at "$PLAN_A_LAST_SUCCESS_AT")
          fi
          python3 scripts/matrix_recovery_control.py "${args[@]}"

      - name: Persist run receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amx-recovery-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/matrix-recovery-control/receipt.json
          retention-days: 90
          if-no-files-found: warn
