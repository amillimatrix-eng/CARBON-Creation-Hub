name: FORX Scale Durable Persistence

on:
  push:
    branches:
      - main
      - forx/100k-persist-20261009
    paths:
      - ".github/workflows/forx-persist-50k.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forx-scale-durable-persistence
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for current FORX production runtime
        shell: bash
        env:
          SERVICE: https://amx-forx-stage1-proof.onrender.com
        run: |
          set -euo pipefail
          mkdir -p /tmp/forxscale

          for attempt in $(seq 1 60); do
            curl -fsSL "$SERVICE/status" -o /tmp/forxscale/status.json
            python - <<'PY'
          import json
          s=json.load(open('/tmp/forxscale/status.json'))
          print(json.dumps(s, sort_keys=True))
          if s.get('status') == 'FAILED':
              raise SystemExit(2)
          PY
            STATUS="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/forxscale/status.json')).get('status',''))
          PY
          )"
            if [ "$STATUS" = "COMPLETE" ]; then
              break
            fi
            sleep 10
          done

          curl -fsSL "$SERVICE/status" -o /tmp/forxscale/status.json
          curl -fsSL "$SERVICE/manifest" -o /tmp/forxscale/manifest.json
          curl -fsSL "$SERVICE/runtime-receipt" -o /tmp/forxscale/runtime-receipt.json

          python - <<'PY'
          import json
          s=json.load(open('/tmp/forxscale/status.json'))
          m=json.load(open('/tmp/forxscale/manifest.json'))
          r=json.load(open('/tmp/forxscale/runtime-receipt.json'))
          assert s['status']=='COMPLETE', s
          assert s['mode']=='production', s
          assert s['target'] >= 100000, s
          assert s['node_count'] == s['target'], s
          assert m['selected_count'] == s['target'], m
          assert m['partition_count'] == s['partition_count'], (m,s)
          assert r['normalized_selected_nodes'] == s['target'], r
          assert not r.get('errors'), r
          print('runtime_acceptance=PASS')
          print('run_id='+m['run_id'])
          print('target='+str(m['selected_count']))
          print('partition_count='+str(m['partition_count']))
          PY

      - name: Persist exact partitions and prove delta beyond 50K
        shell: bash
        env:
          SERVICE: https://amx-forx-stage1-proof.onrender.com
        run: |
          set -euo pipefail

          RUN_ID="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/forxscale/manifest.json'))['run_id'])
          PY
          )"
          PARTITIONS="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/forxscale/manifest.json'))['partition_count'])
          PY
          )"
          DEST="overdrive/forx_scale_proof/$RUN_ID"
          mkdir -p "$DEST"

          cp /tmp/forxscale/status.json "$DEST/status.json"
          cp /tmp/forxscale/manifest.json "$DEST/manifest.json"
          cp /tmp/forxscale/runtime-receipt.json "$DEST/runtime-receipt.json"

          for i in $(seq 1 "$PARTITIONS"); do
            curl -fsSL "$SERVICE/partition/$i" -o "$DEST/partition-$(printf '%03d' "$i").json"
          done

          python - <<'PY'
          import hashlib, json, pathlib

          manifests=list(pathlib.Path('overdrive/forx_scale_proof').glob('*/manifest.json'))
          if not manifests:
              raise SystemExit('scale manifest missing')
          run_dir=max(manifests, key=lambda p:p.stat().st_mtime).parent

          m=json.load(open(run_dir/'manifest.json'))
          current_ids=set()
          total=0

          for i in range(1, m['partition_count']+1):
              p=run_dir/f'partition-{i:03d}.json'
              raw=p.read_bytes()
              got=hashlib.sha256(raw).hexdigest()
              exp=m['partition_hashes'][str(i)]
              if got != exp:
                  raise SystemExit(f'partition {i} raw hash mismatch: {got} != {exp}')
              body=json.loads(raw)
              nodes=body['nodes']
              total += len(nodes)
              current_ids.update(n['source_record_id'] for n in nodes)

          if total != m['selected_count']:
              raise SystemExit(f'count mismatch: {total} != {m["selected_count"]}')
          if len(current_ids) != total:
              raise SystemExit(f'non-unique source ids in current checkpoint: {len(current_ids)} != {total}')

          baseline_dir=pathlib.Path('overdrive/forx_50k_proof/forx-20261007T162100Z')
          baseline_manifest=json.load(open(baseline_dir/'manifest.json'))
          baseline_ids=set()
          for i in range(1, baseline_manifest['partition_count']+1):
              p=baseline_dir/f'partition-{i:03d}.json'
              body=json.loads(p.read_text())
              baseline_ids.update(n['source_record_id'] for n in body['nodes'])

          new_ids=current_ids-baseline_ids
          retained=current_ids & baseline_ids

          if len(new_ids) <= 0:
              raise SystemExit('no graph delta beyond 50K baseline')

          receipt={
              'receipt_type':'FORX_SCALE_DURABLE_PERSISTENCE_READBACK',
              'run_id':m['run_id'],
              'checkpoint_id':m['checkpoint_id'],
              'previous_durable_checkpoint':'overdrive/forx_50k_proof/forx-20261007T162100Z',
              'target':m['target'],
              'exact_node_count_readback':total,
              'unique_source_record_ids':len(current_ids),
              'previous_50k_source_record_ids':len(baseline_ids),
              'retained_source_record_ids_vs_50k':len(retained),
              'new_source_record_ids_vs_50k':len(new_ids),
              'partition_count':m['partition_count'],
              'partition_hashes_verified':True,
              'selection_sha256':m['selection_sha256'],
              'source_file_sha256':m['source_file_sha256'],
              'source_revision':m['source_revision'],
              'status':'PASS_DURABLE_SCALE_DELTA_VERIFIED'
          }
          (run_dir/'durable-readback-receipt.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Commit durable scale proof to this branch
        shell: bash
        run: |
          set -euo pipefail
          git add overdrive/forx_scale_proof
          if git diff --cached --quiet; then
            echo "No staged changes to persist."
            exit 0
          fi
          git config user.name "amillimatrix-eng"
          git config user.email "amillimatrix@gmail.com"
          git commit -m "FORX: persist and verify 100k production checkpoint"
          git push origin HEAD:${GITHUB_REF_NAME}
